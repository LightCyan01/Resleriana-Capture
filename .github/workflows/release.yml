name: Windows verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build and package the exact source
        shell: pwsh
        run: py scripts/build.py --source-commit '${{ github.sha }}'

      - name: Check the packaged runtime and recorder
        shell: pwsh
        run: |
          & work/toolchain/dotnet10/dotnet.exe build Checks/AtelierCapture.Checks -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $captureCheckOutput = 'Checks/AtelierCapture.Checks/bin/Release/net10.0'
          Get-ChildItem work/build/stage/BepInEx/core -File |
            Copy-Item -Destination $captureCheckOutput -Force
          Get-ChildItem work/build/stage/BepInEx/plugins -Filter *.dll -File |
            Copy-Item -Destination $captureCheckOutput -Force
          Copy-Item work/build/stage/dotnet/AtelierCapture.Update.dll -Destination $captureCheckOutput -Force
          & work/toolchain/dotnet10/dotnet.exe "$captureCheckOutput/AtelierCapture.Checks.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py scripts/build.py --self-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-verification
          path: work/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
